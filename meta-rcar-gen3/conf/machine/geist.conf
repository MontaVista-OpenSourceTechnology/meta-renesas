#@TYPE: Machine
#@NAME: Geist machine
#@DESCRIPTION: Machine configuration for running Geist

SOC_FAMILY = "r8a779md"

DEFAULTTUNE = "cortexa57"
require conf/machine/include/tune-cortexa57.inc
require conf/machine/include/rcar_common.inc

# Device tree for M3Le
KERNEL_DEVICETREE = " \
    renesas/r8a779md-geist.dtb \
"

# M3Le u-boot configure
UBOOT_CONFIG ??= "geist"
UBOOT_CONFIG[geist] = "rcar3_geist_defconfig"
